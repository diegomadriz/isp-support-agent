[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isp-support-agent"
version = "0.2.0"
description = "Checkpointed LangGraph support agent with simulated diagnostics"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "langgraph==1.0.1", "langgraph-checkpoint-sqlite==3.0.0", "langchain-core==1.0.2", "langgraph-prebuilt==1.0.1",
  "aiosqlite==0.21.0", "pydantic==2.12.3", "langsmith==0.4.44", "Flask==3.1.2", "httpx==0.28.1", "gunicorn==23.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0", "pytest-socket==0.7.0", "ruff==0.14.1"]

[project.scripts]
isp-agent = "isp_support_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isp_support_agent = ["fixtures/*.json", "templates/*.html"]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket --cov=isp_support_agent --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".work-venv", ".work-tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
