name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      AGENT_MODEL_BACKEND: stub
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e '.[dev]'
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: isp-agent eval --mode rules-only
      - run: isp-agent eval --graph-replay eval/recordings.json --gate
      - run: isp-agent rewrite-eval --replay eval/rewrite-recordings.json --gate
      - run: isp-agent demo
      - run: isp-agent diagram
      - name: Verify generated artifacts
        run: |
          git diff --exit-code -- docs
          test -z "$(git status --porcelain docs)"
